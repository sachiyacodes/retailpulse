[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "1.0.0"
description = "Reproducible retail sales analytics and honest forecasting"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<2.4", "openpyxl>=3.1,<4", "streamlit>=1.67,<2", "altair>=5,<7", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retailpulse = ["dashboard.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a disposable PostgreSQL database via DATABASE_URL"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
