name: RetailPulse checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retailpulse
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: retailpulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retailpulse -d retailpulse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://retailpulse:ci_only_password@localhost:5432/retailpulse_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e '.[dev]' --no-deps
      - run: ruff check .
      - run: python -m compileall -q src
      - run: pytest -q
      - run: python -m retailpulse.pipeline
      - run: python -m retailpulse.database
      - uses: actions/upload-artifact@v7
        with:
          name: reproducible-demo
          path: data/processed/
      - name: Build dashboard image
        run: docker build -t retailpulse:ci .
      - name: Check container health
        run: |
          docker run -d --name retailpulse-ci -p 127.0.0.1:8501:8501 retailpulse:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs retailpulse-ci
          exit 1
      - name: Stop dashboard container
        if: always()
        run: docker rm -f retailpulse-ci || true
